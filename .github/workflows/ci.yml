name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance suite + spec examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
      - name: Run conformance test suite
        run: uv run --with "jsonschema[format-nongpl]" python tests/validate.py
      - name: Validate worked examples in the spec
        run: uv run --with "jsonschema[format-nongpl]" python tests/check_examples.py
      - name: Replay suite-weakening mutations
        run: uv run --with "jsonschema[format-nongpl]" python tests/mutation_smoke.py
